name: MouseVPN

options:
  bundleIdPrefix: dev.mousevpn
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: ""

targets:
  MouseVPN:
    type: application
    platform: macOS
    sources:
      - path: MouseVPNApp
      - path: Shared
      - path: Build/helper/mousevpn-macos-helper
        optional: true
        type: file
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
        attributes:
          - CodeSignOnCopy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mousevpn.mac
        PRODUCT_NAME: MouseVPN
        INFOPLIST_FILE: Config/MouseVPN-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build privileged Rust helper
        path: Scripts/build-helper.sh
        basedOnDependencyAnalysis: false

schemes:
  MouseVPN:
    build:
      targets:
        MouseVPN: all
    run:
      config: Debug
    archive:
      config: Release
