[package]
name = "mousevpn-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hkdf = "0.12"
sha2 = "0.10"
# `ring-accelerated` swaps snow's pure-Rust ChaCha20-Poly1305 and SHA-256 for
# ring's assembly implementations. Same Noise protocol and same bytes on the
# wire; measured at roughly 2.5x the packet throughput on x86-64, and it builds
# for both packaged Android ABIs.
snow = { version = "0.10.0", features = ["ring-accelerated"] }
x25519-dalek = "3.0.0"
zeroize = "1.8"

[lints]
workspace = true
