[package]
name = "mousevpn-apple-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mousevpn_apple"
crate-type = ["staticlib", "rlib"]

[dependencies]
getrandom = "0.3"
mousevpn-config = { path = "../config" }
mousevpn-client-wire = { path = "../client-wire" }
mousevpn-crypto = { path = "../crypto" }
mousevpn-data-plane = { path = "../data-plane" }
mousevpn-protocol = { path = "../protocol" }
mousevpn-transport = { path = "../transport" }
serde_json = "1.0"

[lints.clippy]
all = "warn"
pedantic = "warn"

# The exported C ABI has to validate raw pointers received from Swift. Unsafe
# code is isolated in ffi.rs; the packet/session implementation remains safe Rust.
[lints.rust]
unsafe_code = "allow"
