[package]
name = "mousevpn-profile-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mousevpn-profile"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"
mousevpn-config = { path = "../config" }
pbkdf2 = "0.12"
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.8"

[lints]
workspace = true
